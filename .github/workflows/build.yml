name: build

on:
  push:
    branches: [main]
  pull_request:
  # pull_request runs on bot-opened bump PRs wait for manual approval, so the checker dispatches this directly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: shellcheck -s sh build.sh Tailscale/*.sh test/*.sh

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tailscale.muxapp
          path: dist/Tailscale.muxapp
          if-no-files-found: error

  smoke:
    needs: build
    # Runs the bundled arm64 binaries natively, as close to the handheld as a hosted runner gets
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Tailscale.muxapp
          path: dist

      - name: Smoke test
        run: sudo ./test/smoke.sh
